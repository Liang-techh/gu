<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>蛊道：逆命录</title>
  <style>
    :root { --bg:#101315; --panel:#191e1d; --panel2:#202725; --ink:#e8eadf; --muted:#9ca99c; --gold:#d7af62; --red:#cb6b5e; --green:#8dbf83; --blue:#82aac8; --line:#35413b; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:radial-gradient(circle at top,#25332c 0,#101315 46%,#0b0d0d 100%); font-family:"Microsoft YaHei",system-ui,sans-serif; }
    button,input { font:inherit; }
    button { color:var(--ink); background:#28332f; border:1px solid #46574e; border-radius:6px; padding:9px 12px; cursor:pointer; transition:.15s; }
    button:hover { background:#3b4d43; border-color:var(--gold); transform:translateY(-1px); }
    button:disabled { cursor:not-allowed; opacity:.45; transform:none; }
    .shell { max-width:1500px; margin:0 auto; padding:20px; }
    header { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; border-bottom:1px solid var(--line); padding-bottom:16px; }
    h1 { margin:0; color:var(--gold); letter-spacing:3px; font-size:32px; }
    h2 { margin:0 0 12px; color:var(--gold); font-size:19px; }
    h3 { margin:15px 0 8px; color:#c8d4c5; font-size:14px; }
    .subtitle { color:var(--muted); margin-top:7px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .grid { display:grid; grid-template-columns:270px minmax(420px,1fr) 310px; gap:16px; margin-top:16px; }
    .panel { background:linear-gradient(145deg,rgba(32,39,37,.96),rgba(20,24,23,.96)); border:1px solid var(--line); border-radius:10px; padding:15px; box-shadow:0 12px 30px #0005; }
    .scroll { max-height:680px; overflow:auto; }
    .stat { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed #304039; font-size:13px; }
    .stat span:first-child { color:var(--muted); }
    .value { color:var(--ink); text-align:right; }
    .bar { height:7px; background:#0c100f; border-radius:9px; overflow:hidden; margin:4px 0 9px; }
    .bar i { display:block; height:100%; background:var(--green); width:50%; transition:.3s; }
    .bar.red i { background:var(--red); }
    .bar.blue i { background:var(--blue); }
    .log { height:480px; overflow:auto; padding-right:5px; background:#0b0e0d99; border-radius:7px; padding:12px; }
    .entry { padding:8px 0; border-bottom:1px solid #26312c; line-height:1.65; font-size:14px; }
    .entry time { color:var(--gold); margin-right:8px; font-size:12px; }
    .entry.good { color:#bde0ac; } .entry.bad { color:#e0a29b; } .entry.event { color:#d7c188; }
    .actions { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
    .actions button { min-height:48px; }
    .action-name { display:block; font-size:14px; } .action-cost { display:block; color:var(--muted); font-size:11px; margin-top:3px; }
    .command { display:flex; gap:8px; margin-top:12px; } .command input { flex:1; min-width:0; color:var(--ink); background:#0b100e; border:1px solid var(--line); border-radius:6px; padding:10px; }
    .tag { display:inline-block; margin:3px 3px 3px 0; padding:4px 7px; border-radius:99px; font-size:11px; background:#2b3a32; color:#cadcc8; }
    .tag.gold { color:#f1d18a; background:#493e25; } .tag.red { color:#f1b1a7; background:#492b2b; }
    .card { border:1px solid #33443b; border-radius:7px; padding:9px; margin:7px 0; background:#131917aa; }
    .card strong { color:#ddd08e; } .card small { color:var(--muted); display:block; margin-top:4px; line-height:1.5; }
    .section { margin-top:15px; padding-top:12px; border-top:1px solid var(--line); }
    .hint { color:var(--muted); font-size:12px; line-height:1.65; }
    .dead { color:#f0988a; font-weight:bold; } .alive { color:#b7d99e; font-weight:bold; }
    @media (max-width:1050px) { .grid { grid-template-columns:1fr 1fr; } .center { grid-column:1/-1; grid-row:1; } }
    @media (max-width:680px) { .shell{padding:10px}.grid{display:block}.panel{margin-bottom:12px}.actions{grid-template-columns:repeat(2,1fr)} header{display:block}.toolbar{justify-content:flex-start;margin-top:14px} }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div><h1>蛊道：逆命录</h1><div class="subtitle">一念可救人，一念可吞天。你的命，只由你的选择书写。</div></div>
    <div class="toolbar"><button onclick="saveGame()">保存</button><button onclick="loadGame()">读取</button><button onclick="resetGame()">重开</button></div>
  </header>
  <main class="grid">
    <aside class="panel scroll"><h2>命格</h2><div id="status"></div><div class="section"><h3>道痕</h3><div id="dao"></div></div><div class="section"><h3>阵营与关系</h3><div id="relations"></div></div></aside>
    <section class="panel center"><h2 id="scene">灰潮镇 · 破庙</h2><div id="log" class="log"></div><div id="actions" class="actions"></div><div class="command"><input id="commandInput" placeholder="输入命令：修炼 / 探索 / 状态 / 背包 / 帮助"><button onclick="runCommand()">施令</button></div><div class="hint">提示：行动会推进时间，饥饿、疲劳、伤势和声望都会持续影响结果。每次选择都可能改变隐藏变量与结局。</div></section>
    <aside class="panel scroll"><h2>窍内与行囊</h2><div id="inventory"></div><div class="section"><h3>当前目标</h3><div id="goals"></div></div><div class="section"><h3>世界纪事</h3><div id="chronicle"></div></div></aside>
  </main>
</div>
<script>
const KEY='gu_dao_ni_ming_lu_v1';
const realmNames=['凡人','一转蛊师','二转蛊师','三转蛊师','四转蛊师','五转蛊师','伪仙','真仙'];
const seasons=['春','夏','秋','冬'];
const guCatalog={
  '墨鳞蛊':{rank:1,type:'侦查',desc:'在黑暗中感知细微气息。探索时提高发现稀有资源的概率。',effect:'scout'},
  '青锋蛊':{rank:1,type:'攻伐',desc:'凝出短暂锋芒。狩猎与冲突中提高伤害。',effect:'attack'},
  '照心蛊':{rank:1,type:'心道',desc:'映照自身杂念。冥想时额外获得悟性与心性。',effect:'mind'},
  '纳息蛊':{rank:2,type:'修炼',desc:'吞吐天地元气。修炼时提高真元经验。',effect:'cultivate'},
  '回春蛊':{rank:2,type:'治疗',desc:'温养经脉。休息时缓慢治疗伤势。',effect:'heal'},
  '游商蛊':{rank:2,type:'交易',desc:'感知价格波动。交易时提升议价能力。',effect:'trade'},
  '听风蛊':{rank:3,type:'预兆',desc:'捕捉远方风声。随机事件中降低陷阱概率。',effect:'luck'},
  '换命蛊':{rank:4,type:'禁术',desc:'以寿元换取一次奇迹。危险时可能保住性命。',effect:'sacrifice'}
};
const rng=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function fresh(){return {name:'无名行者',alive:true,day:1,hour:6,season:0,year:1,location:'灰潮镇 · 破庙',realm:0,exp:0,expNeed:100,age:16,lifespan:72,health:100,maxHealth:100,essence:30,maxEssence:30,spirit:70,maxSpirit:100,hunger:12,thirst:12,fatigue:5,injury:0,poison:0,will:55,mind:50,body:48,wisdom:42,courage:35,ambition:40,patience:45,insight:20,luck:35,karma:0,reputation:0,infamy:0,suspicion:8,heat:0,wealth:80,food:5,water:5,herbs:2,ore:1,refineMat:2,aperture:35,apertureMax:100,immortalEssence:0,activeMethod:'吐纳诀',dao:{力道:0,智道:0,血道:0,运道:0,时道:0,剑道:0,梦道:0,奴道:0,炼道:0},inventory:[{name:'墨鳞蛊',rank:1,hunger:15,loyalty:62,durability:86},{name:'照心蛊',rank:1,hunger:18,loyalty:48,durability:100}],relationships:{沈砚:5,季婆婆:12,黑帆商队:-3},factions:{灰潮镇:5,白石学宫:0,夜行会:0,荒兽部落:-5},flags:{firstExplore:false,metSuyan:false,learnedSecret:false,refined:false,omen:false},goals:['活过第七天','让一只蛊虫完成一次进化','找到失落的古窍图'],visited:['灰潮镇 · 破庙'],chronicle:['第一日：你在灰潮镇的破庙中醒来，窍穴微弱，却有一只蛊虫在黑暗中等待。'],log:[]};}
let state=fresh();
function addLog(text,type=''){state.log.push({day:state.day,hour:state.hour,text,type});if(state.log.length>80)state.log.shift();}
function fmt(n){return Math.round(n*10)/10;}
function pct(x,max){return clamp(Math.round(x/max*100),0,100)+'%';}
function advance(hours=1){
  state.hour+=hours; state.fatigue+=hours*2; state.hunger+=hours*1.8; state.thirst+=hours*2.2;
  if(state.hour>=24){state.hour-=24;state.day++;state.age=16+Math.floor(state.day/360);}
  if(state.day%90===0){state.season=(state.season+1)%4; if(state.season===0)state.year++; state.lifespan--;}
  if(state.hunger>85){state.health-=2;addLog('饥饿啃噬着你的脏腑。','bad');}
  if(state.thirst>90){state.health-=3;addLog('喉咙像被砂纸磨过，缺水正在夺走你的命。','bad');}
  if(state.fatigue>95){state.spirit-=2;state.health-=1;}
  state.essence=clamp(state.essence,0,state.maxEssence); state.spirit=clamp(state.spirit,0,state.maxSpirit); state.health=clamp(state.health,0,state.maxHealth);
  for(const g of state.inventory){g.hunger-=hours*2;if(g.hunger<0){g.loyalty-=1;g.durability-=1;}}
  if(Math.random()<0.13)randomEvent();
  if(state.health<=0){state.alive=false;addLog('你倒在无人知晓的角落。逆命失败。','bad');}
}
function randomEvent(){
  const events=[
    ()=>{state.luck+=2;state.karma+=1;addLog('一枚旧铜钱落在你脚边，背面刻着看不懂的星纹。气运小涨。','event');},
    ()=>{state.suspicion+=rng(2,8);state.factions['灰潮镇']-=2;addLog('巡夜人从破庙门外经过，你的气息被记在了册上。','event');},
    ()=>{state.herbs++;state.dao.智道++;addLog('你在墙缝里发现一株无名灵草，叶脉竟像一张地图。','good');},
    ()=>{state.ore++;state.dao.炼道++;addLog('地底传来轻响，你挖出一块带温度的赤色矿石。','good');},
    ()=>{if(state.inventory.length){state.inventory[0].loyalty+=3;addLog('你的蛊虫主动贴近窍壁，似乎认可了你的心志。','good');}else addLog('远处传来蛊虫振翅声，但你什么也没有。','event');},
    ()=>{state.karma-=2;state.infamy++;addLog('你梦见一片无边血海，醒来后心性变得更冷。','bad');}
  ]; pick(events)();
}
function cultivate(){if(!state.alive)return;if(state.essence<5){addLog('真元不足，无法维持吐纳。','bad');return;}const bonus=state.inventory.some(g=>g.name==='纳息蛊')?1.6:1;const gain=fmt((rng(8,15)+state.wisdom/18)*bonus);state.essence=clamp(state.essence+gain,0,state.maxEssence);state.exp+=gain;state.aperture+=rng(1,3);state.dao.智道+=Math.random()<.35?1:0;state.fatigue+=8;state.mind+=1;advance(2);addLog('你盘膝吐纳，窍穴中响起细微潮声，修为增加 '+gain+'。','good');checkBreakthrough();render();}
function checkBreakthrough(){if(state.exp>=state.expNeed){state.realm++;state.exp-=state.expNeed;state.expNeed=Math.round(state.expNeed*1.65);state.maxEssence+=20;state.essence=state.maxEssence;state.maxHealth+=8;state.health=state.maxHealth;state.reputation+=5;state.factions['灰潮镇']+=3;addLog('境界突破：你成为 '+realmNames[state.realm]+'！','event');}}
function explore(){const risk=state.suspicion+state.heat-state.luck/5;advance(4);if(Math.random()<.18+risk/500){const dmg=rng(4,18);state.health-=Math.max(1,dmg-state.courage/12);state.injury+=rng(2,8);state.infamy+=1;addLog('荒径中有东西盯上了你，短暂交锋后你带伤退回。','bad');}else{const roll=Math.random();state.flags.firstExplore=true;state.visited.push(pick(['盐雾沼','断碑坡','赤砂峡','旧矿洞','无灯集']));if(roll<.22){state.ore+=rng(1,3);state.refineMat+=1;state.dao.炼道+=2;addLog('你找到一处被遗忘的矿脉，收获矿石与炼材。','good');}else if(roll<.44){state.wealth+=rng(20,65);state.luck+=1;addLog('你在倒塌的石室里找到一袋古币。','good');}else if(roll<.62){state.exp+=rng(10,28);state.insight+=2;state.flags.learnedSecret=true;addLog('残墙上的刻痕揭示了古老的窍穴运转法，修为大涨。','event');checkBreakthrough();}else if(roll<.8){state.inventory.push({name:pick(['青锋蛊','听风蛊']),rank:1,hunger:20,loyalty:rng(25,55),durability:100});addLog('你从枯木中捕获一只野生蛊虫。','good');}else{state.goals.push('调查断碑上的无名符号');state.karma+=3;addLog('断碑后的石匣没有宝物，只有一封写给未来之人的信。','event');}}render();}
function hunt(){advance(3);const power=state.body+state.courage+state.dao.力道*3+(state.inventory.some(g=>g.name==='青锋蛊')?20:0);if(Math.random()<power/190){const meat=rng(2,6);state.food+=meat;state.herbs+=Math.random()<.4?1:0;state.exp+=rng(4,12);state.body+=1;state.dao.力道+=1;addLog('你猎杀荒兽，获得 '+meat+' 份肉食。','good');}else{state.health-=rng(5,17);state.injury+=rng(3,10);addLog('猎物比想象中凶猛，你负伤逃生。','bad');}render();}
function refine(){if(state.ore<1||state.refineMat<1){addLog('炼材不足，需要矿石和炼材各一份。','bad');render();return;}advance(3);state.ore--;state.refineMat--;const chance=0.38+state.dao.炼道/100+state.wisdom/300;if(Math.random()<chance){const names=Object.keys(guCatalog);const name=pick(names);const spec=guCatalog[name];state.inventory.push({name,rank:spec.rank,hunger:20+spec.rank*5,loyalty:rng(25,70),durability:100});state.flags.refined=true;state.exp+=rng(8,22);state.reputation+=2;addLog('炼道火光熄灭，一只 '+name+' 从灰烬中爬出。','good');}else{state.health-=rng(1,8);state.poison+=rng(1,5);addLog('炼蛊失败，炉中只剩一缕苦烟。','bad');}render();}
function trade(){if(state.wealth<10){addLog('你连摊位费都付不起。','bad');return;}advance(1);const skill=state.wisdom+state.reputation+(state.inventory.some(g=>g.name==='游商蛊')?25:0)-state.suspicion;const gain=rng(10,35)+Math.round(skill/20);state.wealth+=gain-10;state.food+=Math.random()<.5?2:0;state.water+=1;state.refineMat+=Math.random()<.3?1:0;state.factions['灰潮镇']+=1;addLog('你在集市上周旋，净赚 '+(gain-10)+' 枚元石。','good');render();}
function rest(){const heal=state.inventory.some(g=>g.name==='回春蛊')?12:5;state.fatigue=Math.max(0,state.fatigue-35);state.health=clamp(state.health+heal-state.injury/8,0,state.maxHealth);state.injury=Math.max(0,state.injury-3);if(state.food>0){state.food--;state.hunger=Math.max(0,state.hunger-35);}if(state.water>0){state.water--;state.thirst=Math.max(0,state.thirst-45);}advance(8);addLog('你在破庙中休整，伤口暂时稳定。','good');render();}
function meditate(){advance(2);const gain=state.inventory.some(g=>g.name==='照心蛊')?4:2;state.mind+=gain;state.will+=1;state.suspicion=Math.max(0,state.suspicion-2);state.dao.智道+=1;addLog('你观照内心，杂念沉入窍穴，心性增加。','good');render();}
function socialize(){advance(2);const who=pick(Object.keys(state.relationships));const delta=rng(-3,9)+(state.mind>60?2:0);state.relationships[who]+=delta;state.reputation+=delta>0?1:0;if(who==='沈砚')state.flags.metSuyan=true;addLog('你与 '+who+' 交谈，关系变化 '+(delta>=0?'+':'')+delta+'。','event');render();}
function useGu(i){const g=state.inventory[i];if(!g){return;}const spec=guCatalog[g.name];if(g.durability<=0){addLog(g.name+' 已经失去活性。','bad');return;}if(state.essence<3){addLog('真元不足，无法催动 '+g.name+'。','bad');return;}state.essence-=3;g.durability-=rng(1,4);g.hunger=20;const effects={scout:()=>{state.luck+=3;state.suspicion=Math.max(0,state.suspicion-5);addLog('墨鳞铺开感知，你看见了别人忽略的脚印。','good');},attack:()=>{state.courage+=3;state.dao.剑道+=1;addLog('青锋蛊化作一线寒光，你的杀伐之念更锋利了。','event');},mind:()=>{state.mind+=8;state.wisdom+=2;addLog('照心蛊映出心底恐惧，你没有逃。','good');},cultivate:()=>{state.exp+=25;addLog('纳息蛊吞吐元气，修炼经验大涨。','good');},heal:()=>{state.health=clamp(state.health+22,0,state.maxHealth);state.injury=Math.max(0,state.injury-10);addLog('回春蛊温养经脉，伤势好转。','good');},trade:()=>{state.wealth+=20;addLog('游商蛊让你捕捉到一次短暂的价格差。','good');},luck:()=>{state.luck+=12;state.flags.omen=true;addLog('听风蛊带来一则模糊预兆：明日东南方有机缘。','event');},sacrifice:()=>{state.lifespan-=2;state.health=state.maxHealth;state.injury=0;state.heat+=15;addLog('换命蛊燃烧两年寿元，将你从死亡边缘拖回。','event');}};effects[spec.effect]();advance(1);render();}
function statusText(){return state.alive?'生':'死';}
function render(){
  const s=state;document.getElementById('scene').textContent=s.location+' · 第'+s.day+'日 '+String(s.hour).padStart(2,'0')+':00 · '+seasons[s.season]+'季';
  const stats=[['状态',statusText(),s.alive?'alive':'dead'],['境界',realmNames[s.realm]+' '+fmt(s.exp)+'/'+s.expNeed],['年龄/寿元',s.age+' / '+s.lifespan+'年'],['健康',fmt(s.health)+' / '+s.maxHealth],['真元',fmt(s.essence)+' / '+s.maxEssence],['精神',fmt(s.spirit)+' / '+s.maxSpirit],['饥饿',fmt(s.hunger)],['口渴',fmt(s.thirst)],['疲劳',fmt(s.fatigue)],['伤势',fmt(s.injury)],['心性/意志',fmt(s.mind)+' / '+fmt(s.will)],['悟性/胆识',fmt(s.wisdom)+' / '+fmt(s.courage)],['野心/耐心',fmt(s.ambition)+' / '+fmt(s.patience)],['气运/因果',fmt(s.luck)+' / '+fmt(s.karma)],['名望/恶名',fmt(s.reputation)+' / '+fmt(s.infamy)],['戒心/热度',fmt(s.suspicion)+' / '+fmt(s.heat)],['财富',s.wealth+' 元石'],['窍穴',fmt(s.aperture)+' / '+s.apertureMax]];
  document.getElementById('status').innerHTML=stats.map(x=>'<div class="stat"><span>'+x[0]+'</span><span class="value '+(x[2]||'')+'">'+x[1]+'</span></div>').join('')+'<div class="stat"><span>食水药</span><span class="value">'+s.food+' / '+s.water+' / '+s.herbs+'</span></div>';
  document.getElementById('dao').innerHTML=Object.entries(s.dao).map(([k,v])=>'<span class="tag">'+k+' '+v+'</span>').join('');
  document.getElementById('relations').innerHTML='<h3>人物</h3>'+Object.entries(s.relationships).map(([k,v])=>'<div class="stat"><span>'+k+'</span><span class="value">'+v+'</span></div>').join('')+'<h3>阵营</h3>'+Object.entries(s.factions).map(([k,v])=>'<div class="stat"><span>'+k+'</span><span class="value">'+v+'</span></div>').join('');
  document.getElementById('inventory').innerHTML='<div class="stat"><span>活动蛊虫</span><span class="value">'+s.inventory.length+'</span></div>'+s.inventory.map((g,i)=>'<div class="card"><strong>'+g.name+'</strong> <span class="tag">'+(guCatalog[g.name]?.type||'未知')+' '+g.rank+'转</span><small>'+guCatalog[g.name]?.desc+'<br>饥饿 '+fmt(g.hunger)+' · 忠诚 '+fmt(g.loyalty)+' · 耐久 '+fmt(g.durability)+'</small><button onclick="useGu('+i+')">催动</button></div>').join('');
  document.getElementById('goals').innerHTML=s.goals.map(g=>'<div class="card">◇ '+g+'</div>').join('');
  document.getElementById('chronicle').innerHTML=s.chronicle.slice(-8).map(x=>'<div class="hint">'+x+'</div>').join('');
  document.getElementById('log').innerHTML=s.log.map(e=>'<div class="entry '+e.type+'"><time>第'+e.day+'日 '+String(e.hour).padStart(2,'0')+':00</time>'+e.text+'</div>').join('');const log=document.getElementById('log');log.scrollTop=log.scrollHeight;
  const acts=[['修炼','消耗2小时',cultivate],['探索','消耗4小时',explore],['狩猎','消耗3小时',hunt],['炼蛊','矿石+炼材',refine],['交易','消耗1小时',trade],['休息','恢复状态',rest],['冥想','消耗2小时',meditate],['社交','消耗2小时',socialize]];document.getElementById('actions').innerHTML=acts.map(a=>'<button '+(!s.alive?'disabled':'')+' onclick="('+a[2].name+')()"><span class="action-name">'+a[0]+'</span><span class="action-cost">'+a[1]+'</span></button>').join('');
}
function saveGame(){localStorage.setItem(KEY,JSON.stringify(state));addLog('命格已保存于本地。','good');render();}
function loadGame(){const raw=localStorage.getItem(KEY);if(!raw){addLog('尚无本地存档。','bad');render();return;}state=JSON.parse(raw);addLog('你从旧日命格中醒来。','event');render();}
function resetGame(){if(confirm('确定要重开？当前命格将被覆盖。')){state=fresh();addLog('你睁开眼，破庙外的天还没有亮。','event');render();}}
function runCommand(){const el=document.getElementById('commandInput');const c=el.value.trim().toLowerCase();el.value='';const map={'修炼':cultivate,'吐纳':cultivate,'探索':explore,'狩猎':hunt,'炼蛊':refine,'交易':trade,'休息':rest,'睡觉':rest,'冥想':meditate,'社交':socialize,'状态':()=>{addLog('你审视自身：境界 '+realmNames[state.realm]+'，寿元 '+state.lifespan+' 年，当前坐标 '+state.location+'。','event');render();},'背包':()=>{addLog('行囊中有 '+state.inventory.map(x=>x.name).join('、')+'。','event');render();},'帮助':()=>{addLog('可用命令：修炼、探索、狩猎、炼蛊、交易、休息、冥想、社交、状态、背包。','event');render();}};if(map[c])map[c]();else{addLog('没有听懂这道命令。输入“帮助”查看可用命令。','bad');render();}}
addLog('你在灰潮镇的破庙中醒来。窍穴尚未稳固，身边只有两只低阶蛊虫。','event');render();
</script>
